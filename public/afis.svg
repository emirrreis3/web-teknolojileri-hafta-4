<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="50%" stop-color="#9d174d" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.2)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="12" fill="url(#bgGrad)" />

  <!-- Decorative circles -->
  <circle cx="50" cy="50" r="100" fill="white" opacity="0.04" />
  <circle cx="560" cy="80" r="140" fill="white" opacity="0.05" />
  <circle cx="500" cy="350" r="120" fill="white" opacity="0.04" />

  <!-- Content Container Card -->
  <rect x="40" y="35" width="520" height="330" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Badge -->
  <rect x="70" y="65" width="100" height="28" rx="14" fill="url(#accentGrad)" />
  <text x="120" y="84" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">SEMİNER</text>

  <!-- Title -->
  <text x="70" y="145" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">
    Kariyer Günleri
  </text>
  <text x="325" y="145" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="34" font-weight="800">
    2026
  </text>

  <!-- Subtitle -->
  <text x="70" y="180" fill="#fce7f3" font-family="system-ui, sans-serif" font-size="16" font-weight="400">
    Geleceğini Şekillendir &middot; Sektör Liderleriyle Buluşma
  </text>

  <!-- Divider -->
  <line x1="70" y1="210" x2="530" y2="210" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

  <!-- Details Row -->
  <!-- Date & Time -->
  <g transform="translate(70, 235)">
    <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.15)" />
    <path d="M11 9v3h10V9H11zm0 5h10v7H11v-7zm12-9h-1V3h-2v2h-8V3H10v2H9c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2z" fill="#ffffff" transform="scale(0.8) translate(3, 3)" />
    <text x="45" y="14" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">12 Ekim 2026</text>
    <text x="45" y="30" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="12">14:00 - 17:00</text>
  </g>

  <!-- Location -->
  <g transform="translate(260, 235)">
    <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.15)" />
    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#ffffff" transform="scale(0.8) translate(5, 5)" />
    <text x="45" y="14" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">A Blok Konferans Salonu</text>
    <text x="45" y="30" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="12">Merkez Kampüs</text>
  </g>

  <!-- Capacity -->
  <g transform="translate(70, 295)">
    <text x="0" y="25" fill="#fdf2f8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      Kontenjan: <tspan font-weight="700" fill="#ffffff">120 Kişi</tspan> &middot; Katılım Ücretsizdir
    </text>
  </g>
</svg>
